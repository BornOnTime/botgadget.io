<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>BOT Gadget - Login</title>
<link rel="stylesheet"
      href="stylep.css">
</head>
<body>
<div class="auth-page">
<div class="auth-box">
<a href="home.html"
   class="logo">
BOT Gadget<span>Hub</span>
</a>
<h1>
Welcome Back
</h1>
<p class="auth-description">
Login to your GadgetHub account.
</p>
<form>
<label>
Email Address
</label>
<input
type="email"
placeholder="Enter your email"
required
>
<label>
Password
</label>
<input
type="password"
placeholder="Enter your password"
required
>
<div class="remember">
<label>
<input type="checkbox">
Remember me
</label>
<a href="#">
Forgot Password?
</a>
</div>
<button
class="auth-btn"
type="submit">
Login
</button>
</form>
<p class="switch-auth">
Don't have an account?
<a href="signup.html">
Create Account
</a>
</p>
<a href="home.html"
   class="back-home">
← Back to Home
</a>
</div>
</div>
</body>
</html>
