<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>BOT Gadget - Sign Up</title>
<link rel="stylesheet"
      href="stylep.css">
</head>
<body>
<div class="auth-page">
<div class="auth-box">
<a href="./home.html"
   class="logo">
BOT Gadget<span>Hub</span>
</a>
<h1>
Create Account
</h1>
<p class="auth-description">
Join BOT Gadget and start shopping.
</p>
<form>
<label>
Full Name
</label>
<input
type="text"
placeholder="Enter your full name"
required
>
<label>
Email Address
</label>
<input
type="email"
placeholder="Enter your email"
required
>
<label>
Phone Number
</label>
<input
type="text"
placeholder="08012345678"
required
>
<label>
Password
</label>
<input
type="password"
placeholder="Create a password"
required
>
<label>
Confirm Password
</label>
<input
type="password"
placeholder="Confirm your password"
required
>
<label class="terms">
<input
type="checkbox"
required
>
I agree to the Terms & Conditions
</label>
<button
class="auth-btn"
type="submit">
Create Account
</button>
</form>
<p class="switch-auth">
Already have an account?
<a href="./login.html">
Login
</a>
</p>
<a href="./home.html"
   class="back-home">
← Back to Home
</a>
</div>
</div>
</body>
</html>
